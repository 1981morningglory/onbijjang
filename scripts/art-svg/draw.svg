<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#3b2a14" flood-opacity="0.28"/></filter>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#2a1d0e" flood-opacity="0.25"/></filter>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef7a5c"/><stop offset="1" stop-color="#c2412d"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59a7e"/><stop offset="1" stop-color="#d4533a"/></linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe55c"/><stop offset="1" stop-color="#e3c21f"/></linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e2d8"/></linearGradient>
    <radialGradient id="b1" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e3a800"/></radialGradient>
    <radialGradient id="b2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8cc8f0"/><stop offset="1" stop-color="#2f80c0"/></radialGradient>
    <radialGradient id="b3" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#9edb8a"/><stop offset="1" stop-color="#3b9a3f"/></radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="1" stop-color="#e3cf1f"/></linearGradient>
  </defs>
  <ellipse cx="500" cy="900" rx="380" ry="44" fill="#3b2a14" opacity="0.12"/>
  <!-- 선물 상자 -->
  <g filter="url(#drop)">
    <rect x="230" y="430" width="440" height="400" rx="40" fill="url(#box)"/>
    <rect x="200" y="350" width="500" height="120" rx="36" fill="url(#lid)"/>
    <rect x="410" y="350" width="80" height="480" rx="16" fill="url(#rib)"/>
    <path d="M450 350 C 360 230, 250 290, 330 350 Z" fill="url(#rib)"/>
    <path d="M450 350 C 540 230, 650 290, 570 350 Z" fill="url(#rib)"/>
    <circle cx="450" cy="345" r="34" fill="#f2d33a"/>
  </g>
  <rect x="250" y="450" width="140" height="18" rx="9" fill="#fff" opacity="0.25"/>
  <!-- 주사위 두 개 -->
  <g filter="url(#drop)">
    <g transform="rotate(-14 690 640)">
      <rect x="600" y="550" width="180" height="180" rx="34" fill="url(#die)" stroke="#d8d1c2" stroke-width="4"/>
      <circle cx="645" cy="595" r="17" fill="#2b2b2b"/><circle cx="690" cy="640" r="17" fill="#2b2b2b"/><circle cx="735" cy="685" r="17" fill="#2b2b2b"/>
    </g>
    <g transform="rotate(12 800 790)">
      <rect x="720" y="710" width="160" height="160" rx="30" fill="url(#die)" stroke="#d8d1c2" stroke-width="4"/>
      <circle cx="760" cy="750" r="15" fill="#2b2b2b"/><circle cx="840" cy="750" r="15" fill="#2b2b2b"/><circle cx="760" cy="830" r="15" fill="#2b2b2b"/><circle cx="840" cy="830" r="15" fill="#2b2b2b"/>
    </g>
  </g>
  <!-- 로또 공 -->
  <g filter="url(#soft)">
    <circle cx="180" cy="720" r="74" fill="url(#b1)"/>
    <circle cx="150" cy="560" r="58" fill="url(#b2)"/>
    <circle cx="280" cy="840" r="52" fill="url(#b3)"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">
    <circle cx="180" cy="720" r="38" fill="#fff" opacity="0.92"/><text x="180" y="738" font-size="48" fill="#c98f00">7</text>
    <circle cx="150" cy="560" r="30" fill="#fff" opacity="0.92"/><text x="150" y="575" font-size="38" fill="#2f80c0">13</text>
    <circle cx="280" cy="840" r="27" fill="#fff" opacity="0.92"/><text x="280" y="853" font-size="34" fill="#3b9a3f">45</text>
  </g>
  <!-- 반짝이 -->
  <g filter="url(#soft)">
    <path d="M790 190 L806 238 L854 254 L806 270 L790 318 L774 270 L726 254 L774 238 Z" fill="url(#star)"/>
    <path d="M220 230 L230 258 L258 268 L230 278 L220 306 L210 278 L182 268 L210 258 Z" fill="url(#star)"/>
  </g>
</svg>
