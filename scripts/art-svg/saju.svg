<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#3b2a14" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#2a1d0e" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e2"/><stop offset="1" stop-color="#e8d7b6"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8a60"/><stop offset="1" stop-color="#1c4f35"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa778"/><stop offset="1" stop-color="#2e7d4f"/></linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef7a5c"/><stop offset="1" stop-color="#c2412d"/></linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9be63"/><stop offset="1" stop-color="#b9842a"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9ced6"/><stop offset="1" stop-color="#8a919c"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fae"/><stop offset="1" stop-color="#24527a"/></linearGradient>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffb08f"/><stop offset="1" stop-color="#e2502f"/>
    </radialGradient>
    <radialGradient id="dark" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3f8a60"/><stop offset="1" stop-color="#174a31"/>
    </radialGradient>
    <radialGradient id="light" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ead9b8"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="1" stop-color="#e3cf1f"/></linearGradient>
  </defs>

  <!-- 바닥 그림자 -->
  <ellipse cx="500" cy="900" rx="360" ry="46" fill="#3b2a14" opacity="0.12"/>

  <!-- 두루마리 판 -->
  <g filter="url(#drop)">
    <rect x="170" y="190" width="620" height="640" rx="38" fill="url(#paper)"/>
    <rect x="150" y="160" width="660" height="56" rx="28" fill="url(#rod)"/>
    <rect x="150" y="806" width="660" height="56" rx="28" fill="url(#rod)"/>
    <rect x="170" y="172" width="620" height="14" rx="7" fill="#ffffff" opacity="0.18"/>
  </g>
  <!-- 제목 줄 -->
  <rect x="250" y="258" width="300" height="30" rx="15" fill="#e3cf1f" opacity="0.9"/>
  <rect x="250" y="304" width="200" height="16" rx="8" fill="#3b3326" opacity="0.55"/>

  <!-- 네 기둥(시·일·월·연) × 천간·지지 = 여덟 글자 -->
  <g filter="url(#soft)">
    <!-- 위 줄: 천간 -->
    <rect x="240" y="360" width="112" height="150" rx="22" fill="url(#water)"/>
    <rect x="372" y="360" width="112" height="150" rx="22" fill="url(#metal)"/>
    <rect x="504" y="360" width="112" height="150" rx="22" fill="url(#fire)"/>
    <rect x="636" y="360" width="112" height="150" rx="22" fill="url(#wood)"/>
    <!-- 아래 줄: 지지 -->
    <rect x="240" y="530" width="112" height="150" rx="22" fill="url(#earth)"/>
    <rect x="372" y="530" width="112" height="150" rx="22" fill="url(#wood)"/>
    <rect x="504" y="530" width="112" height="150" rx="22" fill="url(#water)"/>
    <rect x="636" y="530" width="112" height="150" rx="22" fill="url(#fire)"/>
  </g>
  <!-- 글자 대신 획 모양 -->
  <g stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M268 405 H324 M296 405 V470 M272 440 H320"/>
    <path d="M400 400 H456 M428 400 V470 M404 470 H452"/>
    <path d="M532 405 H588 M560 395 V470 M538 440 L582 470"/>
    <path d="M664 410 H720 M692 395 V470 M668 455 H716"/>
    <path d="M268 575 H324 M296 565 V640 M272 640 H320"/>
    <path d="M400 575 L456 575 M428 565 V640 M404 615 H452"/>
    <path d="M532 580 H588 M560 570 V640 M536 640 L584 610"/>
    <path d="M664 575 H720 M692 565 V640 M668 610 H716"/>
  </g>
  <!-- 하이라이트 -->
  <g fill="#ffffff" opacity="0.22">
    <rect x="252" y="370" width="88" height="18" rx="9"/><rect x="384" y="370" width="88" height="18" rx="9"/>
    <rect x="516" y="370" width="88" height="18" rx="9"/><rect x="648" y="370" width="88" height="18" rx="9"/>
    <rect x="252" y="540" width="88" height="18" rx="9"/><rect x="384" y="540" width="88" height="18" rx="9"/>
    <rect x="516" y="540" width="88" height="18" rx="9"/><rect x="648" y="540" width="88" height="18" rx="9"/>
  </g>
  <!-- 아래 설명 줄 -->
  <rect x="250" y="712" width="250" height="18" rx="9" fill="#3b3326" opacity="0.45"/>
  <rect x="250" y="746" width="170" height="18" rx="9" fill="#e3cf1f" opacity="0.85"/>

  <!-- 음양 동전 -->
  <g filter="url(#drop)">
    <circle cx="790" cy="760" r="128" fill="url(#coin)"/>
    <circle cx="790" cy="760" r="96" fill="url(#light)"/>
    <path d="M790 664 A96 96 0 0 1 790 856 A48 48 0 0 1 790 760 A48 48 0 0 0 790 664 Z" fill="url(#dark)"/>
    <circle cx="790" cy="712" r="15" fill="url(#light)"/>
    <circle cx="790" cy="808" r="15" fill="url(#dark)"/>
    <ellipse cx="748" cy="690" rx="34" ry="14" fill="#ffffff" opacity="0.35" transform="rotate(-30 748 690)"/>
  </g>

  <!-- 반짝이 -->
  <g filter="url(#soft)">
    <path d="M820 230 L836 278 L884 294 L836 310 L820 358 L804 310 L756 294 L804 278 Z" fill="url(#star)"/>
    <path d="M150 600 L160 628 L188 638 L160 648 L150 676 L140 648 L112 638 L140 628 Z" fill="url(#star)"/>
  </g>
</svg>
