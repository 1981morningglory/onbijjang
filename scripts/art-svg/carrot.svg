<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#3b2a14" flood-opacity="0.28"/></filter>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ece6d8"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0f5"/><stop offset="1" stop-color="#d9f0fb"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc46a"/><stop offset="1" stop-color="#3d9a4a"/></linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f5c"/><stop offset="1" stop-color="#23262e"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3c"/><stop offset=".55" stop-color="#f57a1f"/><stop offset="1" stop-color="#d95a10"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd36a"/><stop offset="1" stop-color="#2f9a45"/></linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="1" stop-color="#f2c21f"/></linearGradient>
  </defs>
  <ellipse cx="512" cy="905" rx="380" ry="42" fill="#3b2a14" opacity="0.12"/>
  <!-- 영상 필름 -->
  <g filter="url(#drop)" transform="rotate(10 700 420)">
    <rect x="520" y="230" width="330" height="250" rx="30" fill="url(#film)"/>
    <g fill="#f7f4ec" opacity=".9">
      <rect x="545" y="248" width="34" height="22" rx="6"/><rect x="605" y="248" width="34" height="22" rx="6"/><rect x="665" y="248" width="34" height="22" rx="6"/><rect x="725" y="248" width="34" height="22" rx="6"/><rect x="785" y="248" width="34" height="22" rx="6"/>
      <rect x="545" y="440" width="34" height="22" rx="6"/><rect x="605" y="440" width="34" height="22" rx="6"/><rect x="665" y="440" width="34" height="22" rx="6"/><rect x="725" y="440" width="34" height="22" rx="6"/><rect x="785" y="440" width="34" height="22" rx="6"/>
    </g>
    <path d="M660 315 L760 355 L660 395 Z" fill="#ffffff"/>
  </g>
  <!-- 사진 액자 -->
  <g filter="url(#drop)" transform="rotate(-8 330 470)">
    <rect x="150" y="300" width="380" height="330" rx="30" fill="url(#frame)"/>
    <rect x="180" y="330" width="320" height="230" rx="16" fill="url(#sky)"/>
    <circle cx="430" cy="385" r="30" fill="#ffd34d"/>
    <path d="M180 520 C 250 450, 320 470, 380 500 C 430 470, 470 470, 500 490 L500 560 L180 560 Z" fill="url(#hill)"/>
  </g>
  <!-- 당근 -->
  <g filter="url(#drop)" transform="rotate(-28 520 640)">
    <path d="M470 400 C 400 380, 380 300, 420 250 C 450 300, 470 330, 500 390 Z" fill="url(#leaf)"/>
    <path d="M520 395 C 520 300, 560 240, 610 225 C 600 290, 580 340, 545 400 Z" fill="url(#leaf)"/>
    <path d="M500 395 C 470 330, 470 250, 512 210 C 540 260, 535 330, 525 395 Z" fill="#5cbf55"/>
    <path d="M420 410 C 420 380, 610 380, 610 410 C 610 520, 560 700, 515 860 C 470 700, 420 520, 420 410 Z" fill="url(#car)"/>
    <g stroke="#c24f0c" stroke-width="10" stroke-linecap="round" opacity=".55">
      <path d="M445 480 L485 488"/><path d="M548 540 L590 530"/><path d="M462 610 L498 618"/><path d="M530 690 L560 682"/>
    </g>
    <path d="M450 420 C 452 520, 470 600, 492 700" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity=".35"/>
  </g>
  <!-- 반짝이 -->
  <g filter="url(#drop)">
    <path d="M790 600 C 800 650, 815 665, 865 675 C 815 685, 800 700, 790 750 C 780 700, 765 685, 715 675 C 765 665, 780 650, 790 600 Z" fill="url(#star)"/>
